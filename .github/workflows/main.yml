name: KnowledgeGraph CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # PYTHON ENVIRONMENT
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "No Python tests found"; fi

      # -----------------------------
      # NODE + HARDHAT ENVIRONMENT
      # -----------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: |
          npm install

      - name: Compile Solidity contracts
        run: |
          npx hardhat compile

      # -----------------------------
      # OPTIONAL: DEPLOY TO SOMNIA
      # -----------------------------
      - name: Deploy KGProvenance to Somnia Testnet
        if: github.ref == 'refs/heads/main'
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          npx hardhat run scripts/deploy_kg_provenance.ts --network somnia

      # -----------------------------
      # OPTIONAL: LINTING
      # -----------------------------
      - name: Python linting
        run: |
          pip install flake8
          flake8 agents || true

      - name: Node linting
        run: |
          npm install --save-dev eslint
          npx eslint . || true
